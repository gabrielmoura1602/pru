<style>
/* Layout: uma coluna central, abas no topo. "Agora" mostra uma tarefa por vez; a barra do dia mostra as horas planejadas contra a capacidade. */
:root{
  color-scheme:light;
  --bg:#F1F4F8; --surface:#FFFFFF; --surface2:#E7ECF2; --ink:#111B26; --muted:#556375; --line:#D3DBE5;
  --accent:#2B4BD9; --accent-ink:#FFFFFF; --accent-soft:#E2E8FB;
  --p4:#C42B38; --p3:#B86A00; --p2:#0B7F82; --p1:#6E7B8A;
  --ok:#17794F; --bad:#C42B38; --warn:#B86A00;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Public Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',Consolas,'Courier New',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D141C; --surface:#151F2A; --surface2:#1E2A37; --ink:#E7ECF2; --muted:#94A2B3; --line:#2A3846;
    --accent:#8197FF; --accent-ink:#0D141C; --accent-soft:#1E2A55;
    --p4:#FF6F7A; --p3:#F0A631; --p2:#3FC6C8; --p1:#93A0AF;
    --ok:#4CC38A; --bad:#FF6F7A; --warn:#F0A631; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D141C; --surface:#151F2A; --surface2:#1E2A37; --ink:#E7ECF2; --muted:#94A2B3; --line:#2A3846;
  --accent:#8197FF; --accent-ink:#0D141C; --accent-soft:#1E2A55;
  --p4:#FF6F7A; --p3:#F0A631; --p2:#3FC6C8; --p1:#93A0AF;
  --ok:#4CC38A; --bad:#FF6F7A; --warn:#F0A631; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);
  padding-block:8px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:900px;margin:0 auto}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.top{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:14px 0 6px}
.brand{font:800 30px/1 var(--font-display);letter-spacing:-.03em}
.date{color:var(--muted);font-size:13px}.date::first-letter{text-transform:uppercase}
.grow{flex:1 1 auto;min-width:0}
.sync{font:500 11px var(--font-mono);color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 9px;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:10px 0 18px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn.ghost{background:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h2{font:700 20px/1.2 var(--font-display);margin:0 0 4px;letter-spacing:-.01em}
h3{font:600 12px var(--font-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
/* prioridade */
.p4{--pc:var(--p4)}.p3{--pc:var(--p3)}.p2{--pc:var(--p2)}.p1{--pc:var(--p1)}
.pp{display:inline-block;font:600 11px var(--font-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--pc);border:1px solid var(--pc);border-radius:4px;padding:1px 6px}

.chip.bad{color:var(--bad)}.chip.warn{color:var(--warn)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

.cap{display:flex;gap:2px;height:16px;background:var(--surface2);border-radius:4px;overflow:hidden}
.cap i{display:block;height:100%;background:var(--pc);min-width:3px}
.capmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13px}
/* tarefa principal */
.hero{padding:24px}
.hero .ttl{font:800 clamp(26px,5vw,38px)/1.1 var(--font-display);letter-spacing:-.025em;margin:10px 0 12px;overflow-wrap:anywhere}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.hero .acts .btn.primary{padding:11px 22px;font-size:16px}
.note{border:1px dashed var(--warn);border-radius:8px;padding:12px;margin-top:18px;background:var(--surface2)}
.note input{width:100%;margin:8px 0;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}

.list{display:flex;flex-direction:column}
.trow{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.chk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--pc,var(--muted));background:none;cursor:pointer;margin-top:2px;padding:0;display:grid;place-items:center;color:transparent}
.chk:hover{background:var(--surface2)}
.trow.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.trow.done .tt{text-decoration:line-through;color:var(--muted)}
.tmain{flex:1 1 200px;min-width:0}
.tt{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.tt:hover{text-decoration:underline}
.tmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
.tact{display:flex;gap:6px;flex:none}
/* formulários */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font:500 12px var(--font-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px;min-height:38px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{border-color:var(--pc,var(--accent));color:var(--pc,var(--accent));font-weight:600;box-shadow:inset 0 0 0 1px var(--pc,var(--accent))}
.qa{display:grid;grid-template-columns:minmax(180px,3fr) repeat(3,minmax(90px,1fr)) auto;gap:8px;align-items:end}
@media (max-width:640px){.qa{grid-template-columns:1fr 1fr}.qa .field:first-child{grid-column:1/-1}}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:16px 0 4px}
.group{margin-top:20px}
.group h3 .n{color:var(--ink)}
/* calendário */
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.calhead h2{flex:1;margin:0}.calhead h2::first-letter{text-transform:uppercase}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font:500 11px var(--font-mono);text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.cd{min-height:58px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 5px;cursor:pointer;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:2px}
.cd.out{opacity:.45}
.cd.today .num{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 6px}
.cd.sel{background:var(--accent-soft);border-color:var(--accent)}
.cd .num{font:500 12px var(--font-mono);align-self:flex-start}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--pc)}
.agenda .arow{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.agenda .arow:last-child{border-bottom:0}
.agenda .when{flex:none;width:96px;font:500 13px var(--font-mono);color:var(--muted)}
.agenda .conf{color:var(--bad);font-size:12px}
/* disciplina */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{border-top:3px solid var(--line);padding-top:8px}
.stat b{display:block;font:700 30px/1.1 var(--font-display)}
.stat span{font-size:13px;color:var(--muted)}
.stat.bad{border-top-color:var(--bad)}.stat.warn{border-top-color:var(--warn)}.stat.ok{border-top-color:var(--ok)}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:130px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.bar .v{font:500 12px var(--font-mono)}
.bar .b{width:100%;max-width:38px;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.bar .b.f{background:var(--p2)}
.bar .l{font:500 11px var(--font-mono);color:var(--muted);text-transform:uppercase}
/* camadas */
.scrim{position:fixed;inset:0;background:rgba(8,13,20,.6);z-index:50;display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;width:100%;max-width:540px;max-height:100%;overflow:auto;padding:22px}
.sheet.alert{border-top:5px solid var(--pc,var(--accent))}
.focus{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
  padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.ring{position:relative;width:min(70vw,280px);aspect-ratio:1/1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font:500 clamp(36px,10vw,58px) var(--font-mono)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:70;font-size:14px;max-width:90vw}
.empty{text-align:center;padding:40px 16px}
.empty h2{font-size:24px}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.cats{display:flex;flex-direction:column;gap:8px}
.catrow{display:flex;gap:8px;align-items:center}
.catrow input[type=color]{width:38px;height:34px;padding:2px;flex:none;min-height:0}
@media (prefers-reduced-motion:no-preference){.btn,.tab,.cd{transition:background .12s,border-color .12s}}

/* ===== Android / celular ===== */
html,body{overscroll-behavior:none}
*{-webkit-tap-highlight-color:transparent}
button,.cd,.tab,.chk{touch-action:manipulation}
.btn{min-height:44px}

.chk{width:26px;height:26px}
.seg button{min-height:40px}

  body{padding-block:2px calc(150px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  .top{flex-wrap:nowrap;align-items:center;padding:8px 0 4px;gap:10px}
  .brand{font-size:28px}
  .desk-new{display:none}

  .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 2px 9px;min-height:60px;font-size:11px;border-bottom:0;border-top:3px solid transparent}
  .tab svg{display:block}
  .tab[aria-selected="true"]{border-top-color:var(--accent);color:var(--accent)}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:45;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font:400 32px/1 var(--font-body);box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer;padding:0 0 3px}
  body[data-tab="cfg"] .fab{display:none}

  .sheet{max-width:none;max-height:92%;border-radius:18px 18px 0 0;border-bottom:0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}

  .hero{padding:18px}

  .trow{flex-wrap:wrap}
  .tact{flex:1 1 100%;margin-left:38px}
  .tact .btn{flex:1}
  .card{padding:14px}
  .cd{min-height:48px;padding:3px 4px}

  input[type=text],input[type=number],input[type=date],input[type=time],select{min-height:44px}
}

/* ---------- avisos nativos do Android ---------- */
var NAT=window.PrumoNative||null,natTimer=null;
function remLabel(m){return m>=1440?'1 dia':(m===60?'1 h':m+' min')}
/* Lista tudo o que o Android deve avisar daqui para frente. */
function planNotifications(){
  var now=Date.now(),out=[];
  S.tasks.forEach(function(t){
    if(t.done||t.remind<0||!t.date)return;
    var base=baseMs(t);if(base==null)return;
    var info=PR[t.prio]+' · '+fmtMin(t.est),ex={taskId:t.id},pre=base-t.remind*60000;
    if(t.remind>0&&pre>now)out.push({at:pre,title:'Em '+remLabel(t.remind)+': '+t.title,body:info,extra:ex});
    if(base>now)out.push({at:base,title:'Hora de: '+t.title,body:info,extra:ex});
    var at=base;
    for(var k=1;k<=4;k++){
      at+=Math.max(2,S.settings.insist*Math.pow(.75,k-1))*(t.time?1:6)*60000;
      if(at>now)out.push({at:at,title:'Atrasada: '+t.title,body:'Atrasada há '+fmtMin((at-base)/60000)+' · '+info,extra:ex});
    }
  });
  var f=S.focus;
  if(f&&f.runStart&&!f.finished){
    var end=f.runStart+f.remaining,ft=byId(f.taskId);
    if(end>now)out.push({at:end,title:'Bloco de foco concluído',body:ft?ft.title:'',extra:{taskId:f.taskId,kind:'focus'}});
  }
  out.sort(function(a,b){return a.at-b.at});
  return out.slice(0,180);
}
function scheduleNative(){
  if(!NAT)return;
  clearTimeout(natTimer);
  natTimer=setTimeout(function(){try{NAT.schedule(planNotifications())}catch(e){}},500);
}

  if(ui.editor){closeEditor();return}
  if(ui.alertQ.length){ui.alertQ.shift();renderAlerts();return}
  if(S.focus){NAT.minimize();return}
  if(ui.tab!=='now'){ui.tab='now';renderTabs();renderView();return}
  NAT.exit();
}
function initNative(){
  applyTheme();

      if(t&&!t.done&&x.kind!=='focus'&&ui.alertQ.indexOf(t.id)<0)ui.alertQ.push(t.id);
      renderTabs();if(!ui.editor&&!ui.postpone)renderView();renderAlerts();
    },

/* ---------- regras ---------- */
function byId(id){return S.tasks.find(function(t){return t.id===id})}
function cat(id){return S.cats.find(function(c){return c.id===id})||S.cats[0]}
function dueMs(t){return t.date?dt(t.date,t.time||'23:59').getTime():null}
function baseMs(t){return t.date?dt(t.date,t.time||S.settings.dayStart).getTime():null}
function isOver(t,now){var d=dueMs(t);return !t.done&&d!=null&&d<(now||Date.now())}
function score(t,now){
  var s=t.prio*100, d=dueMs(t), td=ymd(new Date(now));
  if(d!=null){
    var diff=(d-now)/60000;
    if(diff<0)s+=300+Math.min(-diff,600)/10;
    else if(t.date===td)s+=150+Math.max(0,240-diff)/4;
    else if(t.date===addDays(td,1))s+=50;
  }
  return s+t.postponed*15;
}
function openSorted(){var now=Date.now();return S.tasks.filter(function(t){return !t.done}).sort(function(a,b){return score(b,now)-score(a,now)})}
function nextDate(t){
  var d=t.date||todayStr(), x=dt(d);
  if(t.repeat==='daily')x.setDate(x.getDate()+1);
  else if(t.repeat==='weekly')x.setDate(x.getDate()+7);
  else if(t.repeat==='monthly')x.setMonth(x.getMonth()+1);
  else if(t.repeat==='weekdays'){do{x.setDate(x.getDate()+1)}while(x.getDay()===0||x.getDay()===6)}
  return ymd(x);
}
function complete(t){
  if(t.done)return;
  t.done=true;t.doneAt=Date.now();t.alert=null;
  if(t.repeat&&t.repeat!=='none'){
    var c=JSON.parse(JSON.stringify(t));
    c.id=uid();c.done=false;c.doneAt=0;c.postponed=0;c.history=[];c.alert=null;c.actual=0;c.example=false;c.date=nextDate(t);
    S.tasks.push(c);
  }
  if(S.focus&&S.focus.taskId===t.id)closeFocus(true);
  ui.alertQ=ui.alertQ.filter(function(i){return i!==t.id});
}
function uncomplete(t){t.done=false;t.doneAt=0}
function newTask(o){
  return Object.assign({id:uid(),title:'',notes:'',cat:S.cats[0].id,prio:2,est:25,date:'',time:'',remind:-1,repeat:'none',done:false,doneAt:0,postponed:0,actual:0,history:[],alert:null,snoozeUntil:0,example:false,created:Date.now()},o);
}
function applyPostpone(t,choice,reason){
  var now=new Date(), from=(t.date||'')+' '+(t.time||'');
  if(choice==='30'||choice==='120'){
    var n=new Date(roundUp(Date.now()+Number(choice)*60000,5));
    t.date=ymd(n);t.time=hm(n);
  }else if(choice==='tomorrow'){t.date=addDays(todayStr(),1);t.time=S.settings.dayStart}
  else if(choice==='week'){
    var d=new Date(now);do{d.setDate(d.getDate()+1)}while(d.getDay()!==1);
    t.date=ymd(d);t.time=S.settings.dayStart;
  }
  t.postponed=(t.postponed||0)+1;
  t.history=(t.history||[]).concat([{at:Date.now(),reason:reason||'',from:from.trim()}]).slice(-12);
  t.alert=null;t.snoozeUntil=0;
  ui.alertQ=ui.alertQ.filter(function(i){return i!==t.id});
}

var actx=null;
function unlockAudio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
document.addEventListener('pointerdown',unlockAudio,{once:false});
function beep(n){
  if(!S.settings.sound||!actx)return;
  try{
    for(var i=0;i<(n||1);i++){
      var o=actx.createOscillator(),g=actx.createGain(),t0=actx.currentTime+i*.28;
      o.type='sine';o.frequency.value=i%2?660:880;o.connect(g);g.connect(actx.destination);
      g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.25,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.24);
      o.start(t0);o.stop(t0+.26);
    }
  }catch(e){}
}
function notify(title,body){
  if(NAT)return;
  try{if(window.Notification&&Notification.permission==='granted')new Notification(title,{body:body})}catch(e){}
}

  var el=document.getElementById('toast');el.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';

/* ---------- lembretes insistentes ---------- */
function checkAlerts(){
  var now=Date.now(),changed=false;
  S.tasks.forEach(function(t){
    if(t.done||t.remind<0||!t.date)return;
    if(S.focus&&S.focus.taskId===t.id)return;
    if(t.snoozeUntil&&now<t.snoozeUntil)return;
    var base=baseMs(t),at=base-t.remind*60000;
    if(now<at)return;
    var a=t.alert,fire=false;
    if(!a)fire=true;
    else if(now>=base){
      var iv=Math.max(2,S.settings.insist*Math.pow(.75,a.n-1))*(t.time?1:6)*60000;
      if(a.last<base||now-a.last>=iv)fire=true;
    }
    if(fire){
      t.alert={n:(a?a.n:0)+1,last:now};changed=true;
      if(ui.alertQ.indexOf(t.id)<0)ui.alertQ.push(t.id);
      notify(isOver(t,now)?'Atrasada: '+t.title:'Hora de: '+t.title,PR[t.prio]+' · '+fmtMin(t.est));
      beep(t.prio>=3?3:1);
    }
  });
  if(changed){touch();renderAlerts()}
}

/* ---------- foco ---------- */
function focusRemaining(){var f=S.focus;if(!f)return 0;return f.runStart?f.remaining-(Date.now()-f.runStart):f.remaining}
function logFocus(min,id){
  if(min<=0)return;

  S.focusLog.push({d:todayStr(),m:min,id:id});
}
function startFocus(id){
  var t=byId(id);if(!t)return;
  if(S.focus&&S.focus.taskId!==id)closeFocus(false);
  var block=Math.max(1,t.est<=S.settings.focusMin?t.est:S.settings.focusMin);
  S.focus={taskId:id,block:block,total:block*60000,remaining:block*60000,runStart:Date.now(),finished:false};
  ui.alertQ=ui.alertQ.filter(function(i){return i!==id});
  touch();renderAll();
}
function closeFocus(logPartial){
  var f=S.focus;if(!f)return;
  if(logPartial&&!f.finished){
    var el=f.total-Math.max(0,focusRemaining());
    logFocus(Math.round(el/60000),f.taskId);
  }
  S.focus=null;
}
function finishBlock(){
  var f=S.focus;if(!f||f.finished)return;
  f.finished=true;f.remaining=0;f.runStart=null;
  logFocus(Math.round(f.total/60000),f.taskId);

  touch();renderFocus();
}
function tickFocus(){
  var f=S.focus;if(!f||f.finished)return;
  var r=focusRemaining();
  if(r<=0){finishBlock();return}
  var el=document.getElementById('fTime');
  if(el){var s=Math.ceil(r/1000);el.textContent=pad(Math.floor(s/60))+':'+pad(s%60)}

function groupTasks(list){

  var head='<div class="calhead"><h2>'+first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})+'</h2>'+
    '<button class="btn sm" data-act="calprev" aria-label="Mês anterior">‹</button><button class="btn sm" data-act="caltoday">Hoje</button><button class="btn sm" data-act="calnext" aria-label="Próximo mês">›</button></div>';
  var grid='<div class="cal">'+WD.map(function(w){return '<div class="wd">'+w+'</div>'}).join('')+cells+'</div>';
  var day=S.tasks.filter(function(t){return t.date===ui.calSel}).sort(function(a,b){
    return (a.time?0:1)-(b.time?0:1)||(a.time||'').localeCompare(b.time||'')||b.prio-a.prio});
  var timed=day.filter(function(t){return t.time&&!t.done});
  function range(t){var s=dt(t.date,t.time).getTime();return [s,s+t.est*60000]}
  var rows=day.map(function(t){
    var when='dia todo',conf='';
    if(t.time){var r=range(t),e=new Date(r[1]);when=t.time+'–'+hm(e);
      if(!t.done&&timed.some(function(o){if(o===t)return false;var q=range(o);return q[0]<r[1]&&q[1]>r[0]}))conf='<div class="conf">Horário em conflito com outra tarefa</div>'}
    return '<div class="arow p'+t.prio+'"><div class="when">'+when+'</div><div class="tmain"><button class="tt" data-act="edit" data-id="'+t.id+'" style="'+(t.done?'text-decoration:line-through;color:var(--muted)':'')+'">'+esc(t.title)+'</button>'+
      '<div class="tmeta"><span class="pp">'+PR[t.prio]+'</span><span class="chip mono">'+fmtMin(t.est)+'</span></div>'+conf+'</div></div>';
  }).join('');
  var sum=day.filter(function(t){return !t.done}).reduce(function(a,t){return a+t.est},0);
  var ag='<div class="card agenda" style="margin-top:16px"><div class="row"><h2 class="grow" style="margin:0;text-transform:capitalize">'+esc(dayLabel(ui.calSel))+'</h2>'+
    '<span class="chip mono">'+fmtMin(sum)+' abertas</span><button class="btn sm primary" data-act="newday" data-v="'+ui.calSel+'">+ Neste dia</button></div>'+
    (rows||'<p class="muted">Nada marcado para este dia.</p>')+'</div>';
  return head+grid+ag;
}

function viewDisc(){
  var now=Date.now(),open=S.tasks.filter(function(t){return !t.done});
  var over=open.filter(function(t){return isOver(t,now)});
  var post=open.filter(function(t){return t.postponed>=2});
  var wk=[],i;
  for(i=6;i>=0;i--){wk.push(addDays(todayStr(),-i))}
  var doneBy=wk.map(function(d){return S.tasks.filter(function(t){return t.done&&t.doneAt&&ymd(new Date(t.doneAt))===d}).length});
  var focBy=wk.map(function(d){return S.focusLog.filter(function(f){return f.d===d}).reduce(function(a,f){return a+f.m},0)});
  var dmax=Math.max(1,Math.max.apply(null,doneBy)),fmax=Math.max(1,Math.max.apply(null,focBy));
  var doneW=doneBy.reduce(function(a,b){return a+b},0),focW=focBy.reduce(function(a,b){return a+b},0);
  var withDue=S.tasks.filter(function(t){return t.done&&t.date&&t.doneAt});
  var onTime=withDue.filter(function(t){return t.doneAt<=dueMs(t)}).length;
  var rate=withDue.length?Math.round(onTime/withDue.length*100):null;
  var acc=S.tasks.filter(function(t){return t.done&&t.actual>0&&t.est>0});
  var ratio=acc.length?Math.round(acc.reduce(function(a,t){return a+t.actual/t.est},0)/acc.length*100):null;
  function bars(arr,max,cls,unit){return '<div class="bars">'+arr.map(function(v,k){
    var d=dt(wk[k]);return '<div class="bar"><span class="v">'+(v?v+unit:'')+'</span><div class="b '+cls+'" style="height:'+(v/max*78)+'%"></div><span class="l">'+WD[d.getDay()]+'</span></div>'}).join('')+'</div>'}
  var worst=open.filter(function(t){return t.postponed>0}).sort(function(a,b){return b.postponed-a.postponed}).slice(0,6);
  var tip='';
  if(over.length)tip='Você tem '+over.length+' tarefa'+(over.length>1?'s':'')+' atrasada'+(over.length>1?'s':'')+'. Resolva primeiro a mais curta para ganhar tração.';
  else if(post.length)tip='Há tarefas adiadas várias vezes. Quebre cada uma em um passo de 10 minutos.';
  else tip='Nada atrasado agora. Continue marcando horário nas tarefas importantes.';
  return '<div class="stack"><div class="card"><h3>Situação agora</h3><div class="stats">'+
    '<div class="stat '+(over.length?'bad':'ok')+'"><b class="mono">'+over.length+'</b><span>atrasadas</span></div>'+
    '<div class="stat '+(post.length?'warn':'ok')+'"><b class="mono">'+post.length+'</b><span>adiadas 2 vezes ou mais</span></div>'+
    '<div class="stat"><b class="mono">'+(rate==null?'–':rate+'%')+'</b><span>concluídas no prazo</span></div>'+
    '<div class="stat"><b class="mono">'+(ratio==null?'–':ratio+'%')+'</b><span>do tempo estimado, em média</span></div></div>'+
    '<p style="margin:16px 0 0">'+esc(tip)+'</p></div>'+
    '<div class="card"><h3>Concluídas nos últimos 7 dias · '+doneW+'</h3>'+bars(doneBy,dmax,'','')+'</div>'+
    '<div class="card"><h3>Minutos de foco nos últimos 7 dias · '+fmtMin(focW)+'</h3>'+bars(focBy,fmax,'f','')+'</div>'+
    '<div class="card"><h3>Mais adiadas</h3>'+(worst.length?'<div class="list">'+worst.map(function(t){
      var rs=(t.history||[]).map(function(h){return h.reason}).filter(Boolean).slice(-2).join('; ');
      return '<div class="trow p'+t.prio+'"><div class="tmain"><button class="tt" data-act="edit" data-id="'+t.id+'">'+esc(t.title)+'</button>'+
        '<div class="tmeta"><span class="chip warn mono">adiada '+t.postponed+'×</span>'+(rs?'<span class="small muted">Motivos: '+esc(rs)+'</span>':'')+'</div></div></div>'}).join('')+'</div>':
      '<p class="muted" style="margin:0">Nenhuma tarefa foi adiada ainda.</p>')+'</div></div>';
}

/* ---------- ações ---------- */
function readEditor(){
  var title=document.getElementById('eT').value.trim();
  if(!title){document.getElementById('eErr').textContent='Dê um título para a tarefa.';return null}
  var prio=Number((document.querySelector('#eP [aria-pressed="true"]')||{}).dataset&&document.querySelector('#eP [aria-pressed="true"]').dataset.pp)||2;
  var est=Math.max(1,Math.min(600,Math.round(Number(document.getElementById('eM').value)||25)));
  var date=document.getElementById('eD').value,time=document.getElementById('eH').value;
  if(time&&!date)date=todayStr();
  return {title:title,prio:prio,est:est,cat:document.getElementById('eC').value,date:date,time:date?time:'',
    remind:date?Number(document.getElementById('eR').value):-1,repeat:document.getElementById('eRp').value,notes:document.getElementById('eN').value};
}
function openEditor(id,preset){ui.editor={id:id||null,preset:preset||null};ui.confirmDel=false;renderModal()}
function closeEditor(){ui.editor=null;ui.confirmDel=false;renderModal()}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act],[data-pp],[data-min],[data-ppc]');
  if(!el)return;
  if(el.dataset.pp){document.querySelectorAll('#eP button').forEach(function(b){b.setAttribute('aria-pressed',String(b===el))});return}
  if(el.dataset.min){document.getElementById('eM').value=el.dataset.min;return}
  if(el.dataset.ppc){ui.postpone.choice=el.dataset.ppc;document.querySelectorAll('#ppOpts button').forEach(function(b){b.setAttribute('aria-pressed',String(b===el))});return}
  var act=el.dataset.act,id=el.dataset.id,v=el.dataset.v,t=id?byId(id):null;
  if(el.classList.contains('scrim')&&e.target!==el)return;
  switch(act){
    case 'tab':ui.tab=v;renderTabs();renderView();window.scrollTo(0,0);if(v==='cfg')refreshPerm();break;
    case 'new':openEditor(null,{date:ui.tab==='cal'?ui.calSel:'',remind:10});break;
    case 'newday':openEditor(null,{date:v,remind:10});break;
    case 'edit':openEditor(id);break;
    case 'closeed':case 'closeed2':closeEditor();break;
    case 'saveed':
      var d=readEditor();if(!d)break;
      if(ui.editor.id){var tk=byId(ui.editor.id);
        var chg=tk.date!==d.date||tk.time!==d.time||tk.remind!==d.remind;
        Object.assign(tk,d);if(chg){tk.alert=null;tk.snoozeUntil=0}
      }else S.tasks.push(newTask(d));
      closeEditor();commit();toast('Tarefa salva');break;
    case 'deltask':ui.confirmDel=true;renderModal();break;
    case 'deltask2':S.tasks=S.tasks.filter(function(x){return x.id!==ui.editor.id});
      if(S.focus&&S.focus.taskId===ui.editor.id)S.focus=null;
      closeEditor();commit();renderFocus();toast('Tarefa excluída');break;
    case 'toggle':if(!t)break;
      if(t.done){uncomplete(t);commit()}else{complete(t);commit();renderFocus();toast('Concluída')}break;
    case 'focus':startFocus(id);break;
    case 'postpone':ui.postpone={id:id,choice:null};renderModal();break;
    case 'closepp':case 'closepp2':ui.postpone=null;renderModal();break;
    case 'ppok':
      var pt=byId(ui.postpone.id),why=(document.getElementById('ppWhy')||{}).value||'';
      if(!ui.postpone.choice){document.getElementById('ppErr').textContent='Escolha quando fazer.';break}
      if(pt.postponed>=2&&why.trim().length<3){document.getElementById('ppErr').textContent='Escreva o motivo para adiar de novo.';break}
      applyPostpone(pt,ui.postpone.choice,why.trim());ui.postpone=null;renderModal();commit();toast('Adiada · '+whenLabel(pt));break;
    case 'split':
      var txt=(document.getElementById('stepIn').value||'').trim();if(!t)break;
      if(!txt){document.getElementById('stepIn').focus();break}
      S.tasks.push(newTask({title:'Primeiro passo: '+txt,prio:t.prio,est:10,cat:t.cat,date:todayStr()}));
      t.postponed=0;commit();toast('Primeiro passo criado');break;
    case 'showrest':ui.showRest=true;refresh();break;
    case 'hiderest':ui.showRest=false;refresh();break;
    case 'showdone':ui.showDone=true;refresh();break;
    case 'hidedone':ui.showDone=false;refresh();break;
    case 'fcat':ui.fcat=v;refresh();break;
    case 'calprev':ui.calM--;if(ui.calM<0){ui.calM=11;ui.calY--}refresh();break;
    case 'calnext':ui.calM++;if(ui.calM>11){ui.calM=0;ui.calY++}refresh();break;
    case 'caltoday':var n=new Date();ui.calY=n.getFullYear();ui.calM=n.getMonth();ui.calSel=ymd(n);refresh();break;
    case 'calsel':ui.calSel=v;refresh();break;
    case 'rmex':S.tasks=S.tasks.filter(function(x){return !x.example});commit();break;
    case 'testbeep':unlockAudio();beep(2);break;
    case 'askperm':
      if(NAT){NAT.requestPerm().then(function(p){ui.perm=p;if(ui.tab==='cfg')renderView();toast(p.notifications==='granted'?'Notificações ativadas':'Ative nas configurações do Android')})}
      else{try{Notification.requestPermission().then(function(){refresh()}).catch(function(){})}catch(x){toast('O navegador não permite avisos aqui')}}
      break;
    case 'openexact':if(NAT)NAT.openExactSettings();break;
    case 'testnotif':if(NAT){NAT.test(5).then(function(){toast('Chega em 5 segundos. Pode sair do app para testar')}).catch(function(){toast('Não foi possível agendar o teste')})}break;
    case 'theme':S.settings.theme=isDark()?'light':'dark';touch();applyTheme();if(ui.tab==='cfg')renderView();break;
    case 'settheme':S.settings.theme=v;touch();applyTheme();renderView();break;
    case 'bkcopy':
      var bkJs=JSON.stringify(S);
      (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(bkJs):Promise.reject()).then(function(){toast('Backup copiado. Cole em um lugar seguro')}).catch(function(){
        var bkTa=document.createElement('textarea');bkTa.value=bkJs;document.body.appendChild(bkTa);bkTa.select();
        var bkOk=false;try{bkOk=document.execCommand('copy')}catch(x){}
        bkTa.remove();toast(bkOk?'Backup copiado. Cole em um lugar seguro':'Não foi possível copiar')});
      break;
    case 'bkopen':ui.showRestore=true;renderView();break;
    case 'bkcancel':ui.showRestore=false;renderView();break;
    case 'bkrestore':
      var bkRaw=(document.getElementById('bkText')||{}).value||'',bkObj=null;
      try{bkObj=JSON.parse(bkRaw.trim())}catch(x){}
      if(!bkObj||!Array.isArray(bkObj.tasks)){toast('Backup inválido');break}
      S=normalize(bkObj);ui.showRestore=false;touch();applyTheme();renderAll();toast('Backup restaurado');break;
    case 'addcat':
      var nm=document.getElementById('ncName').value.trim();if(!nm)break;
      S.cats.push({id:'c'+uid(),name:nm.slice(0,24),color:document.getElementById('ncColor').value});commit();break;
    case 'delcat':
      S.cats=S.cats.filter(function(c){return c.id!==id});
      S.tasks.forEach(function(x){if(x.cat===id)x.cat=S.cats[0].id});
      if(ui.fcat===id)ui.fcat='all';commit();break;
    /* alertas */
    case 'al-focus':startFocus(id);break;
    case 'al-done':if(t){complete(t);commit();renderFocus()}break;
    case 'al-pp':ui.postpone={id:id,choice:null};ui.alertQ=ui.alertQ.filter(function(i){return i!==id});renderAlerts();renderModal();break;
    case 'al-mute':ui.alertQ=ui.alertQ.filter(function(i){return i!==id});renderAlerts();break;
    /* foco */
    case 'f-pause':
      var f=S.focus;if(!f)break;
      if(f.runStart){f.remaining=focusRemaining();f.runStart=null}else f.runStart=Date.now();
      touch();renderFocus();break;
    case 'f-plus':var g=S.focus;if(!g)break;
      var cur=focusRemaining();g.total+=300000;
      if(g.runStart){g.remaining=cur+300000;g.runStart=Date.now()}else g.remaining+=300000;
      touch();renderFocus();break;
    case 'f-more':var h=S.focus;if(!h)break;
      h.finished=false;h.total=h.block*60000;h.remaining=h.total;h.runStart=Date.now();touch();renderFocus();break;
    case 'f-done':var fo=S.focus,ft=fo&&byId(fo.taskId);if(!ft)break;
      if(!fo.finished){var el=fo.total-Math.max(0,focusRemaining());logFocus(Math.round(el/60000),ft.id);fo.finished=true}
      complete(ft);S.focus=null;commit();renderFocus();toast('Tarefa concluída');break;
    case 'f-exit':closeFocus(true);touch();renderFocus();renderView();break;
  }
});
document.addEventListener('click',function(e){
  /* clique no fundo escuro fecha o modal; clique na folha não */
  var s=e.target;
  if(s.classList&&s.classList.contains('scrim')&&s.parentElement&&s.parentElement.id==='modal'&&s.dataset.act){
    if(ui.postpone){ui.postpone=null}else{ui.editor=null;ui.confirmDel=false}
    renderModal();
  }
});
document.addEventListener('submit',function(e){
  if(e.target.id!=='qaForm')return;
  e.preventDefault();
  var title=document.getElementById('qaT').value.trim();if(!title){document.getElementById('qaT').focus();return}
  var w=document.getElementById('qaW').value,date=w==='today'?todayStr():(w==='tomorrow'?addDays(todayStr(),1):'');
  S.tasks.push(newTask({title:title,prio:Number(document.getElementById('qaP').value),est:Math.max(1,Number(document.getElementById('qaM').value)||25),date:date}));
  touch();renderView();var i=document.getElementById('qaT');if(i)i.focus();toast('Tarefa adicionada');
});
document.addEventListener('change',function(e){
  var el=e.target,s=S.settings;
  if(el.id==='fp'){ui.fprio=Number(el.value);refresh();return}
  if(el.id==='sCap'){s.capacity=Math.max(60,Math.round((Number(el.value)||8)*60));touch();return}
  if(el.id==='sStart'){s.dayStart=el.value||'09:00';touch();return}
  if(el.id==='sFocus'){s.focusMin=Math.max(5,Math.min(90,Number(el.value)||25));touch();return}
  if(el.id==='sIns'){s.insist=Math.max(2,Math.min(120,Number(el.value)||10));touch();return}
  if(el.id==='sSound'){s.sound=el.checked;touch();return}
  if(el.dataset&&el.dataset.cc){cat(el.dataset.cc).color=/^#[0-9a-f]{6}$/i.test(el.value)?el.value:'#3B6FD4';touch();return}
  if(el.dataset&&el.dataset.cn){var nm=el.value.trim();if(nm){cat(el.dataset.cn).name=nm.slice(0,24);touch()}return}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(ui.postpone){ui.postpone=null;renderModal()}
    else if(ui.editor){closeEditor()}
  }
  if(e.key==='Enter'&&ui.editor&&e.target&&e.target.id==='eT'){e.preventDefault();var b=document.querySelector('[data-act="saveed"]');if(b)b.click()}
});

/* ---------- relógio ---------- */
renderAll();
if(firstRun)touch();
setInterval(tickFocus,500);
setInterval(function(){
  checkAlerts();
  var a=document.activeElement,typing=a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT');
  if(ui.tab==='now'&&!ui.editor&&!ui.postpone&&!typing)renderView();
},15000);
setTimeout(checkAlerts,800);
document.addEventListener('visibilitychange',function(){
  if(!document.hidden){checkAlerts();if(ui.tab==='now'&&!ui.editor&&!ui.postpone)renderView()}
});
initNative();
})();
</script>

</body></html>
